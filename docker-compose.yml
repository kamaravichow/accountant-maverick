# Local/self-hosted stack: the app + MinIO as S3-compatible object storage.
# For AWS S3, drop the minio services and set S3_ENDPOINT_URL empty + AWS credentials.
services:
  app:
    build: .
    ports: ["8000:8000"]
    env_file: .env
    environment:
      STORAGE_BACKEND: s3
      S3_BUCKET: accountant-maverick
      S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-maverick}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-maverick-secret}
      AWS_DEFAULT_REGION: us-east-1
    volumes: ["appdata:/data"]
    depends_on: [minio]
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-maverick}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-maverick-secret}
    ports: ["9000:9000", "9001:9001"]
    volumes: ["miniodata:/data"]
    restart: unless-stopped

volumes:
  appdata:
  miniodata:
